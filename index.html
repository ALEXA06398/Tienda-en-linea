<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda en Línea - Tarjeta de Producto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Menú de navegación -->
  <header class="navbar">
    <nav>
      <ul class="menu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Ofertas</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenedor principal -->
  <main class="contenedor">
    <!-- Tarjeta de producto -->
    <div class="tarjeta-producto">
      
      <!-- Contenedor de la imagen con position: relative -->
      <div class="imagen-contenedor">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80" alt="Audífonos inalámbricos">
        <!-- Etiqueta de oferta con position: absolute -->
        <span class="etiqueta-oferta">¡OFERTA!</span>
      </div>

      <!-- Información del producto -->
      <div class="info-producto">
        <h2 class="nombre-producto">Audífonos Inalámbricos Pro</h2>
        <p class="descripcion-producto">
          Sonido envolvente de alta fidelidad con cancelación activa de ruido y hasta 30 horas de batería.
        </p>
        <p class="precio-producto">$1,299.00 MXN</p>
        <button class="btn-comprar">Agregar al carrito</button>
      </div>

    </div>
  </main>

</body>
</html>
